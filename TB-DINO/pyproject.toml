[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tb-dino"
version = "0.1.0"
description = "TB-DINO remote-sensing change detection with DINOv3, LoRA, ATIM and AlphaEarth alignment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "rasterio>=1.3",
  "torch>=2.3",
  "torchvision>=0.18",
  "transformers>=4.56,<6",
  "peft>=0.17",
  "tqdm>=4.66",
  "tensorboard>=2.15",
]

[project.optional-dependencies]
earthengine = ["earthengine-api>=1.5"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["tb_dino*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that need external weights, data, or credentials",
]

