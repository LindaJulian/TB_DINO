preprocess:
  mode: levir
  image_a_dir: data/raw/LEVIR-CD/A
  image_b_dir: data/raw/LEVIR-CD/B
  mask_dir: data/raw/LEVIR-CD/label
  output_dir: data/prepared/levir_cd
  patch_size: 256
  stride: 256
  bands: [1, 2, 3]
  seed: 42
  strict_pairing: true
  timestamp_a: t0
  timestamp_b: t1
  split:
    train: 0.6
    val: 0.2
    test: 0.2

