seed: 42
deterministic: true
output_dir: outputs/tb_dino

data:
  train_manifest: data/prepared/train.jsonl
  val_manifest: data/prepared/val.jsonl
  test_manifest: data/prepared/test.jsonl
  bands: [1, 2, 3]
  scale_divisor: 255.0
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  batch_size: 1
  eval_batch_size: 1
  num_workers: 0
  pin_memory: true
  drop_last: false
  augmentation:
    geometry_probability: 0.5
    spectral_jitter: 0.05

model:
  backbone: facebook/dinov3-vitb16-pretrain-lvd1689m
  local_files_only: false
  trust_remote_code: false
  input_channels: 3
  patch_size: 16
  hidden_dim: 128
  use_lora: true
  gradient_checkpointing: true
  encoder_chunk_size: 2
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]
  atim_heads: 2
  atim_dropout: 0.1
  atim_mlp_ratio: 2.0
  use_alphaearth: false
  alpha_channels: 64
  sca:
    margin: 0.2
    max_samples: 512
    hard_negatives: 256
    negative_weight: 1.0

loss:
  pos_weight: auto
  max_pos_weight: 20.0
  dice_weight: 1.0
  sca_weight: 0.1

training:
  device: auto
  epochs: 100
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  gradient_accumulation: 4
  gradient_clip: 1.0
  amp: true
  save_full_model: false
  threshold: 0.5
  resume: null

evaluation:
  device: auto

inference:
  mode: manifest
  device: auto
  output_dir: outputs/tb_dino/predictions
  batch_size: 1
  tile_size: 256
  stride: 128
  use_memmap: true
  threshold: null
  write_png: true
